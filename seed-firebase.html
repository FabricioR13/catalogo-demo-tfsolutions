<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seed Firebase – Joalheria</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', sans-serif; background: #0f0f0f; color: #eee; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px; }
    h1 { font-size: 1.4rem; margin-bottom: 8px; color: #f0c040; }
    p  { font-size: .9rem; color: #aaa; margin-bottom: 24px; text-align: center; max-width: 480px; }
    #btn { padding: 14px 36px; background: #f0c040; color: #000; font-size: 1rem; font-weight: 700; border: none; border-radius: 8px; cursor: pointer; transition: opacity .2s; }
    #btn:disabled { opacity: .45; cursor: not-allowed; }
    #log  { margin-top: 24px; width: 100%; max-width: 540px; background: #1a1a1a; border: 1px solid #333; border-radius: 8px; padding: 16px; font-size: .8rem; font-family: monospace; max-height: 360px; overflow-y: auto; }
    .ok   { color: #4caf50; }
    .err  { color: #f44336; }
    .info { color: #90caf9; }
  </style>
</head>
<body>

<h1>🔥 Seed de Produtos – Joalheria</h1>
<p>Clique no botão abaixo para enviar todos os produtos, categorias e o cupom ao Firestore do Firebase. Execute <strong>apenas uma vez</strong>. Se rodar novamente, usará <code>set</code> com o mesmo ID (não duplica).</p>

<button id="btn">🚀 Enviar Produtos ao Firebase</button>

<div id="log"><span class="info">Aguardando…</span></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script>
// ATENÇÃO: config removida de propósito nesta cópia de demonstração (pertencia
// ao projeto Firebase real da PG Semi Joias). Preencha com as credenciais do
// projeto Firebase novo e isolado, criado só para esta demo, antes de usar.
// Também vale trocar os produtos de exemplo abaixo pelos do nicho escolhido
// para a demonstração ao vivo do admin (ver nichos.js).
const firebaseConfig = {
  apiKey: "",
  authDomain: "",
  projectId: "",
  storageBucket: "",
  messagingSenderId: "",
  appId: ""
};

// Imagens abaixo são placeholders (placehold.co) só para o site não ficar com card quebrado
// antes das fotos reais serem enviadas pelo admin (aba Produtos → Upload/Câmera).
const produtos = [
  { id: 1, nome: "Anel Solitário",     categoria: "anéis",     preco: 89.90,  material: "Prata 925",        pedra: "Zircônia",  tamanho: "Aro 18", disponibilidade: "pronta",    prazoDias: null, imagem: "https://placehold.co/500x500/F7F5F1/B08D57?text=Anel+Solit%C3%A1rio", descricao: "Anel solitário delicado, acabamento polido." },
  { id: 2, nome: "Anel Cravejado",     categoria: "anéis",     preco: 119.90, material: "Folheado a ouro",  pedra: "Zircônias", tamanho: "Aro 16", disponibilidade: "encomenda", prazoDias: 5,    imagem: "https://placehold.co/500x500/F7F5F1/B08D57?text=Anel+Cravejado", descricao: "Aro fino cravejado, ideal para uso diário ou composição." },
  { id: 3, nome: "Pulseira Riviera",   categoria: "pulseiras", preco: 149.90, material: "Prata 925",        pedra: "",          tamanho: "18cm",    disponibilidade: "pronta",    prazoDias: null, imagem: "https://placehold.co/500x500/F7F5F1/B08D57?text=Pulseira+Riviera", descricao: "Pulseira riviera com fecho reforçado." },
  { id: 4, nome: "Pulseira Elos",      categoria: "pulseiras", preco: 79.90,  material: "Aço inoxidável",   pedra: "",          tamanho: "19cm",    disponibilidade: "pronta",    prazoDias: null, imagem: "https://placehold.co/500x500/F7F5F1/B08D57?text=Pulseira+Elos", descricao: "Pulseira de elos, antialérgica, não escurece." },
  { id: 5, nome: "Brinco Argola",      categoria: "brincos",   preco: 69.90,  material: "Folheado a ouro",  pedra: "",          tamanho: "",        disponibilidade: "pronta",    prazoDias: null, imagem: "https://placehold.co/500x500/F7F5F1/B08D57?text=Brinco+Argola", descricao: "Argola média, fecho click, leve para o dia a dia." },
  { id: 6, nome: "Brinco Ponto de Luz", categoria: "brincos",  preco: 59.90,  material: "Prata 925",        pedra: "Zircônia",  tamanho: "",        disponibilidade: "pronta",    prazoDias: null, imagem: "https://placehold.co/500x500/F7F5F1/B08D57?text=Ponto+de+Luz", descricao: "Ponto de luz clássico, combina com tudo." },
];

// Obs: o botão "Todos" é gerado automaticamente pela loja — não precisa (e não deve)
// cadastrar uma categoria com esse nome/id aqui nem no admin.
const categorias = [
  { id: "anéis",     nome: "Anéis",     icone: "fa-ring" },
  { id: "pulseiras", nome: "Pulseiras", icone: "fa-circle-notch" },
  { id: "brincos",   nome: "Brincos",   icone: "fa-gem" },
];

const cupons = [
  { codigo: "DESCONTO10", tipo: "percentual", valor: 10, valorMinimo: 0, validade: null, ativo: true },
];

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const log = document.getElementById("log");
const btn = document.getElementById("btn");

const addLog = (msg, tipo = "ok") => {
  const span = document.createElement("span");
  span.className = tipo;
  span.textContent = msg;
  log.appendChild(span);
  log.appendChild(document.createElement("br"));
  log.scrollTop = log.scrollHeight;
};

btn.addEventListener("click", async () => {
  btn.disabled = true;
  log.innerHTML = "";
  addLog("▶ Iniciando envio...", "info");

  let ok = 0, erros = 0;

  for (const p of produtos) {
    try {
      await db.collection("produtos").doc(String(p.id)).set({
        ...p,
        ativo: true,
        destaque: false,
        criadoEm: firebase.firestore.FieldValue.serverTimestamp()
      });
      addLog(`✔ [${p.id}] ${p.nome}`, "ok");
      ok++;
    } catch (e) {
      addLog(`✘ [${p.id}] ${p.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog("▶ Enviando categorias...", "info");
  for (const c of categorias) {
    try {
      await db.collection("categorias").doc(c.id).set(c);
      addLog(`✔ Categoria: ${c.nome}`, "ok");
    } catch (e) {
      addLog(`✘ Categoria: ${c.nome} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog("▶ Enviando cupons...", "info");
  for (const c of cupons) {
    try {
      await db.collection("cupons").doc(c.codigo).set(c);
      addLog(`✔ Cupom: ${c.codigo}`, "ok");
    } catch (e) {
      addLog(`✘ Cupom: ${c.codigo} — ${e.message}`, "err");
      erros++;
    }
  }

  addLog("", "info");
  addLog(`━━━ CONCLUÍDO: ${ok} produtos enviados, ${erros} erros ━━━`, erros > 0 ? "err" : "info");
  btn.disabled = false;
});
</script>
</body>
</html>
